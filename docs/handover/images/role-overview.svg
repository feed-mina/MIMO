<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<style>
  .title { font: 700 22px sans-serif; fill: #111827; }
  .label { font: 600 14px sans-serif; fill: #111827; }
  .text { font: 13px sans-serif; fill: #374151; }
  .small { font: 12px sans-serif; fill: #4b5563; }
  .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 1.5; rx: 10; ry: 10; }
  .accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.8; rx: 10; ry: 10; }
  .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 10; ry: 10; }
  .data { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.8; rx: 10; ry: 10; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#a); }
  .dash { stroke: #9ca3af; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#a2); }
</style>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af" />
  </marker>
</defs>

<text x="40" y="40" class="title">전체 역할 관계도</text>
<rect x="40" y="90" width="250" height="180" class="accent"/>
<text x="60" y="120" class="label">화면/라우트</text>
<text x="60" y="150" class="text">/, /auth, /main</text>
<text x="60" y="175" class="text">/camera, /simulate</text>
<text x="60" y="200" class="text">/profile, /review, /changepassword</text>
<text x="60" y="235" class="small">App.jsx + Layout + FooterNav</text>

<rect x="340" y="90" width="250" height="180" class="box"/>
<text x="360" y="120" class="label">컴포넌트/상태</text>
<text x="360" y="150" class="text">AuthContext(localStorage token)</text>
<text x="360" y="175" class="text">MainList / ReviewForm / Camera</text>
<text x="360" y="200" class="text">ProfileForm / CartProvider</text>
<text x="360" y="235" class="small">사용자 입력·렌더링·분기 처리</text>

<rect x="640" y="90" width="250" height="180" class="data"/>
<text x="660" y="120" class="label">외부 API / 저장소</text>
<text x="660" y="150" class="text">Firebase Identity Toolkit</text>
<text x="660" y="175" class="text">Firebase Auth / Realtime DB</text>
<text x="660" y="200" class="text">localhost:8000 upload/makeup</text>
<text x="660" y="235" class="small">코드가 직접 호출하는 실제 엔드포인트</text>

<rect x="940" y="90" width="220" height="180" class="warn"/>
<text x="960" y="120" class="label">저장소 밖 의존성</text>
<text x="960" y="150" class="text">Spring Boot API</text>
<text x="960" y="175" class="text">MySQL 스키마</text>
<text x="960" y="200" class="text">AI 모델 서버 구현</text>
<text x="960" y="235" class="small">현재 저장소에는 소스 부재</text>

<line x1="290" y1="180" x2="340" y2="180" class="arrow"/>
<line x1="590" y1="180" x2="640" y2="180" class="arrow"/>
<line x1="890" y1="180" x2="940" y2="180" class="dash"/>

<rect x="130" y="360" width="940" height="170" class="box"/>
<text x="160" y="395" class="label">주요 데이터 이동</text>
<text x="160" y="430" class="text">1) 로그인/회원가입: AuthForm → Firebase Identity Toolkit → idToken → localStorage("token")</text>
<text x="160" y="460" class="text">2) 상품 목록: MainList → /itmes.json 조회 → title/price/content/imgUrl 렌더링</text>
<text x="160" y="490" class="text">3) 리뷰 작성: ReviewForm → FormData 작성 → /createdReviews.json POST → 현재 화면 목록은 mockReview.json 유지</text>
<text x="160" y="520" class="text">4) 카메라 시뮬레이션: camera.js/upload.js → 이미지 업로드 → 세그멘테이션 결과(prediction, imageArray) → OpenCV.js 합성</text>

</svg>