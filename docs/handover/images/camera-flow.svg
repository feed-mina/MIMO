<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>
  .title { font: 700 22px sans-serif; fill: #111827; }
  .label { font: 600 14px sans-serif; fill: #111827; }
  .text { font: 13px sans-serif; fill: #374151; }
  .small { font: 12px sans-serif; fill: #4b5563; }
  .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 1.5; rx: 10; ry: 10; }
  .accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.8; rx: 10; ry: 10; }
  .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 10; ry: 10; }
  .data { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.8; rx: 10; ry: 10; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#a); }
  .dash { stroke: #9ca3af; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#a2); }
</style>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af" />
  </marker>
</defs>

<text x="40" y="40" class="title">카메라·업로드 기능 흐름도</text>
<rect x="70" y="90" width="220" height="70" class="accent"/><text x="95" y="132" class="label">사용자가 촬영 또는 파일 선택</text>
<rect x="70" y="210" width="220" height="80" class="box"/><text x="95" y="245" class="label">이미지 미리보기 생성</text><text x="95" y="268" class="small">canvas 또는 FileReader</text>
<rect x="70" y="345" width="220" height="85" class="box"/><text x="95" y="380" class="label">FormData에 file 추가</text><text x="95" y="403" class="small">field name: file</text>
<rect x="70" y="485" width="220" height="85" class="data"/><text x="95" y="520" class="label">POST /api/v1/upload</text><text x="95" y="543" class="small">응답 사용 필드: path</text>
<rect x="370" y="485" width="220" height="85" class="data"/><text x="395" y="520" class="label">POST /api/v1/makeup</text><text x="395" y="543" class="small">요청: { path }</text>
<rect x="670" y="485" width="250" height="100" class="box"/><text x="695" y="520" class="label">prediction + imageArray 수신</text><text x="695" y="543" class="small">클라이언트가 실제 참조하는 응답</text><text x="695" y="566" class="small">prediction: 파트 id 배열</text>
<rect x="970" y="485" width="170" height="100" class="accent"/><text x="993" y="520" class="label">색상/부위 선택</text><text x="993" y="543" class="small">lip 또는 hair</text><text x="993" y="566" class="small">hex color</text>
<rect x="670" y="635" width="250" height="80" class="box"/><text x="695" y="670" class="label">조건 분기</text><text x="695" y="693" class="small">lip: partId 11,12 / hair: 13</text>
<rect x="970" y="635" width="170" height="80" class="accent"/><text x="995" y="670" class="label">OpenCV.js 합성</text><text x="995" y="693" class="small">canvasOutput 렌더링</text>
<line x1="180" y1="160" x2="180" y2="210" class="arrow"/>
<line x1="180" y1="290" x2="180" y2="345" class="arrow"/>
<line x1="180" y1="430" x2="180" y2="485" class="arrow"/>
<line x1="290" y1="528" x2="370" y2="528" class="arrow"/>
<line x1="590" y1="528" x2="670" y2="528" class="arrow"/>
<line x1="920" y1="535" x2="970" y2="535" class="arrow"/>
<line x1="795" y1="585" x2="795" y2="635" class="arrow"/>
<line x1="1055" y1="585" x2="1055" y2="635" class="arrow"/>
<line x1="920" y1="675" x2="970" y2="675" class="arrow"/>
<rect x="360" y="95" width="780" height="200" class="warn"/>
<text x="390" y="130" class="label">실제 코드 기준 위험/조기 종료 지점</text>
<text x="390" y="165" class="text">• camera.js는 setState와 this 사용이 함수형 컴포넌트와 섞여 있어 현재 구현 그대로는 예외 가능성이 높다.</text>
<text x="390" y="195" class="text">• upload.js는 upload 응답 path를 state에 넣은 직후 this.state.path를 다시 읽어 비동기 타이밍 영향을 받을 수 있다.</text>
<text x="390" y="225" class="text">• localhost:8000 서버가 없으면 업로드 단계에서 즉시 실패하며 대체 경로는 없다.</text>
<text x="390" y="255" class="text">• Apply 단계는 prediction/imageArray가 준비된 뒤에만 의미가 있다.</text>

</svg>