<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<style>
  .title { font: 700 22px sans-serif; fill: #111827; }
  .label { font: 600 14px sans-serif; fill: #111827; }
  .text { font: 13px sans-serif; fill: #374151; }
  .small { font: 12px sans-serif; fill: #4b5563; }
  .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 1.5; rx: 10; ry: 10; }
  .accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.8; rx: 10; ry: 10; }
  .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 10; ry: 10; }
  .data { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.8; rx: 10; ry: 10; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#a); }
  .dash { stroke: #9ca3af; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#a2); }
</style>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af" />
  </marker>
</defs>

<text x="40" y="40" class="title">기능별 데이터 관계도: 리뷰 / 주문</text>
<rect x="70" y="110" width="290" height="140" class="accent"/>
<text x="95" y="140" class="label">ReviewForm values state</text>
<text x="95" y="170" class="text">nickname, rating, content, imgUrl(File)</text>
<text x="95" y="200" class="small">ReviewForm.jsx에서 관리</text>
<rect x="440" y="110" width="290" height="140" class="data"/>
<text x="465" y="140" class="label">/createdReviews</text>
<text x="465" y="170" class="text">POST body: FormData</text>
<text x="465" y="195" class="text">응답 body는 현재 화면에서 미사용</text>
<rect x="810" y="110" width="300" height="140" class="warn"/>
<text x="835" y="140" class="label">ReviewList 렌더링 데이터</text>
<text x="835" y="170" class="text">mockReview.json</text>
<text x="835" y="195" class="text">새로 저장한 리뷰와 자동 동기화되지 않음</text>
<line x1="360" y1="180" x2="440" y2="180" class="arrow"/>
<line x1="730" y1="180" x2="810" y2="180" class="dash"/>

<rect x="70" y="320" width="290" height="140" class="accent"/>
<text x="95" y="350" class="label">Checkout form</text>
<text x="95" y="380" class="text">name, street, city, postalCode</text>
<text x="95" y="405" class="small">5자리 우편번호 검증</text>
<rect x="440" y="320" width="290" height="140" class="box"/>
<text x="465" y="350" class="label">CartContext items</text>
<text x="465" y="380" class="text">id, name, amount, price</text>
<text x="465" y="405" class="small">ADD/REMOVE/CLEAR reducer</text>
<rect x="810" y="320" width="300" height="140" class="data"/>
<text x="835" y="350" class="label">/cart</text>
<text x="835" y="380" class="text">user + orderedItems[] POST</text>
<text x="835" y="405" class="small">현재 App.jsx에는 /cart 라우트 미연결</text>
<line x1="360" y1="390" x2="440" y2="390" class="arrow"/>
<line x1="730" y1="390" x2="810" y2="390" class="arrow"/>

</svg>