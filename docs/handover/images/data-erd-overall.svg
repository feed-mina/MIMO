<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>
  .title { font: 700 22px sans-serif; fill: #111827; }
  .label { font: 600 14px sans-serif; fill: #111827; }
  .text { font: 13px sans-serif; fill: #374151; }
  .small { font: 12px sans-serif; fill: #4b5563; }
  .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 1.5; rx: 10; ry: 10; }
  .accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.8; rx: 10; ry: 10; }
  .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 10; ry: 10; }
  .data { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.8; rx: 10; ry: 10; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#a); }
  .dash { stroke: #9ca3af; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#a2); }
</style>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af" />
  </marker>
</defs>

<text x="40" y="40" class="title">전체 데이터 ERD(저장소에서 확인 가능한 범위)</text>
<rect x="60" y="100" width="250" height="150" class="accent"/>
<text x="85" y="130" class="label">Firebase Auth User</text>
<text x="85" y="160" class="text">uid</text>
<text x="85" y="185" class="text">displayName</text>
<text x="85" y="210" class="text">photoURL</text>
<text x="85" y="235" class="small">currentUser로 읽기</text>

<rect x="360" y="80" width="260" height="180" class="data"/>
<text x="385" y="110" class="label">/itmes/{itemId}</text>
<text x="385" y="140" class="text">title</text>
<text x="385" y="165" class="text">price</text>
<text x="385" y="190" class="text">content</text>
<text x="385" y="215" class="text">imgUrl</text>
<text x="385" y="240" class="small">MainList가 조회</text>

<rect x="690" y="80" width="260" height="180" class="data"/>
<text x="715" y="110" class="label">/createdReviews/{reviewId}</text>
<text x="715" y="140" class="text">nickname</text>
<text x="715" y="165" class="text">rating</text>
<text x="715" y="190" class="text">content</text>
<text x="715" y="215" class="text">imgUrl</text>
<text x="715" y="240" class="small">ReviewForm이 작성</text>

<rect x="690" y="300" width="260" height="180" class="data"/>
<text x="715" y="330" class="label">/review</text>
<text x="715" y="360" class="text">코드에 read helper만 존재</text>
<text x="715" y="385" class="text">현재 라우트에서는 미사용</text>
<text x="715" y="410" class="small">상세 필드 미검증</text>

<rect x="360" y="300" width="260" height="180" class="data"/>
<text x="385" y="330" class="label">/cart/{orderId}</text>
<text x="385" y="360" class="text">user.name</text>
<text x="385" y="385" class="text">user.street/city/postalCode</text>
<text x="385" y="410" class="text">orderedItems[]</text>
<text x="385" y="435" class="small">Cart.jsx가 POST</text>

<rect x="60" y="300" width="250" height="180" class="data"/>
<text x="85" y="330" class="label">/detail/1</text>
<text x="85" y="360" class="text">skinType 관련 데이터</text>
<text x="85" y="385" class="text">toneType 관련 데이터</text>
<text x="85" y="410" class="small">setSkin helper가 조회</text>

<rect x="980" y="150" width="170" height="140" class="warn"/>
<text x="1000" y="180" class="label">MySQL / 서버 DB</text>
<text x="1000" y="210" class="text">현재 저장소에서</text>
<text x="1000" y="235" class="text">스키마 미확인</text>
<text x="1000" y="260" class="small">논리 연결만 추정 금지</text>

<line x1="310" y1="180" x2="360" y2="170" class="arrow"/>
<line x1="310" y1="390" x2="360" y2="390" class="dash"/>
<line x1="620" y1="170" x2="690" y2="170" class="dash"/>
<line x1="620" y1="390" x2="690" y2="390" class="dash"/>
<line x1="950" y1="170" x2="980" y2="190" class="dash"/>
<text x="354" y="520" class="small">실선: 코드에서 직접 연결 확인 / 점선: 논리적으로 함께 쓰이지만 외래키·관계 정의는 저장소에서 확인 불가</text>

</svg>