<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2fbff"/><stop offset="1" stop-color="#f9f5ff"/></linearGradient><linearGradient id="hero" x2="1"><stop stop-color="#1d2335"/><stop offset="1" stop-color="#56365d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<text x="54" y="62" font-family="Arial,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#4a3c9d">AFTER · 개선 예상 화면 · 구현·실행 전 모형</text>
<text x="54" y="101" font-family="Arial,Noto Sans KR,sans-serif" font-size="17" fill="#5f6474">공통 카드 표시와 MIMO 상품 규칙을 분리한 목표 화면입니다. 실제 완료 화면이 아닙니다.</text>
<rect x="65" y="135" width="1070" height="520" rx="26" fill="#fff" stroke="#d9ddeb" filter="url(#s)"/>
<rect x="95" y="165" width="1010" height="112" rx="20" fill="url(#hero)"/>
<text x="130" y="211" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" fill="#e1dcec">MIMO PICKS</text><text x="130" y="247" font-family="Arial,Noto Sans KR,sans-serif" font-size="28" font-weight="700" fill="#fff">오늘의 상품을 골라보세요</text>
<rect x="913" y="194" width="154" height="46" rx="23" fill="#fff" fill-opacity=".14"/><text x="990" y="223" text-anchor="middle" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" fill="#fff">상품 3개</text>
<g transform="translate(95 310)"><rect width="310" height="290" rx="20" fill="#fff" stroke="#dfe3ec"/><rect x="18" y="18" width="274" height="135" rx="14" fill="#f4dce7"/><path d="M96 126l43-44 35 31 38-52 40 65z" fill="#d494b1"/><text x="20" y="184" font-family="Arial,Noto Sans KR,sans-serif" font-size="18" font-weight="700" fill="#202533">설명용 상품 A</text><text x="20" y="216" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#8c315c">29,000원</text><text x="20" y="246" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#707687">상품 설명은 두 줄까지 보여줍니다.</text><rect x="20" y="258" width="270" height="1" fill="#eef0f4"/><text x="20" y="282" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#4a3c9d">Enter 또는 클릭으로 선택</text></g>
<g transform="translate(445 310)"><rect width="310" height="290" rx="20" fill="#fff" stroke="#dfe3ec"/><rect x="18" y="18" width="274" height="135" rx="14" fill="#dcecf2"/><path d="M96 126l43-44 35 31 38-52 40 65z" fill="#91b7c8"/><text x="20" y="184" font-family="Arial,Noto Sans KR,sans-serif" font-size="18" font-weight="700" fill="#202533">설명용 상품 B</text><text x="20" y="216" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#8c315c">41,000원</text><text x="20" y="246" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#707687">긴 제목과 설명도 카드 안에서 정리됩니다.</text><rect x="20" y="258" width="270" height="1" fill="#eef0f4"/><text x="20" y="282" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#4a3c9d">안전한 이동 주소만 사용</text></g>
<g transform="translate(795 310)"><rect width="310" height="290" rx="20" fill="#fff" stroke="#dfe3ec"/><rect x="18" y="18" width="274" height="135" rx="14" fill="#f1f2f6"/><circle cx="155" cy="74" r="28" fill="#d5d9e2"/><path d="M137 74h36M155 56v36" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="20" y="184" font-family="Arial,Noto Sans KR,sans-serif" font-size="18" font-weight="700" fill="#202533">이미지 없는 상품</text><text x="20" y="216" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#8c315c">19,000원</text><text x="20" y="246" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#707687">빠진 그림은 대체 화면으로 표시합니다.</text><rect x="20" y="258" width="270" height="1" fill="#eef0f4"/><text x="20" y="282" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#4a3c9d">누락 상태도 정상 구분</text></g>
<g transform="translate(95 615)"><circle cx="9" cy="9" r="8" fill="#55b886"/><text x="27" y="15" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#52606d">표시는 공통 카드 · 조회와 이동은 MIMO 연결부 · 찜 저장은 KMovement 전용</text></g>
</svg>